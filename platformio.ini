[platformio]
default_envs = subnode, gateway
src_dir = .

[env:subnode]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter =
    +<shared/*.h>
    +<subnode/*.cpp>
    -<gateway/*>

[env:gateway]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter =
    +<shared/*.h>
    +<gateway/*.cpp>
    -<subnode/*>
